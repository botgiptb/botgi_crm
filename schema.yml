components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lead:
          type: integer
        user:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
        activity_type:
          $ref: '#/components/schemas/ActivityTypeEnum'
        is_outbound:
          type: boolean
          readOnly: true
        title:
          type: string
          maxLength: 200
        notes:
          type: string
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activity_type
      - created_at
      - id
      - is_outbound
      - lead
      - user
      - user_name
    ActivityTypeEnum:
      enum:
      - call
      - whatsapp
      - note
      - visit_walk_in
      - email
      - quotation_sent
      - system
      type: string
      description: |-
        * `call` - Phone Call
        * `whatsapp` - WhatsApp Message
        * `note` - Internal Note
        * `visit_walk_in` - In-Store Visit
        * `email` - Email
        * `quotation_sent` - Quotation Sent
        * `system` - System Event
    AuthResponse:
      type: object
      properties:
        access:
          type: string
          description: Short-lived in-memory JWT access token
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - user
    BlankEnum:
      enum:
      - ''
    CustomTokenObtainPair:
      type: object
      description: Custom SimpleJWT serializer providing user details and role claims.
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        alt_phone:
          type: string
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        company_name:
          type: string
          maxLength: 150
        gstin:
          type: string
          maxLength: 20
        notes:
          type: string
        is_active:
          type: boolean
        total_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        last_purchase_at:
          type: string
          format: date-time
          readOnly: true
        open_leads_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_purchase_at
      - name
      - open_leads_count
      - phone
      - total_spend
      - updated_at
    CustomerTypeEnum:
      enum:
      - individual
      - business
      type: string
      description: |-
        * `individual` - Individual
        * `business` - Business
    FollowUp:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lead:
          type: integer
        assigned_to:
          type: integer
          readOnly: true
          nullable: true
        assigned_to_name:
          type: string
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/FollowUpStatusEnum'
          readOnly: true
        reminder_type:
          $ref: '#/components/schemas/ReminderTypeEnum'
        note:
          type: string
