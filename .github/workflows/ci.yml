name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI (PostgreSQL 16, Ruff, Black, Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopcrm_test
          POSTGRES_USER: shopcrm
          POSTGRES_PASSWORD: shopcrm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-django pytest ruff black

      - name: Lint with ruff
        run: ruff check backend

      - name: Code format check with black
        run: black --check backend

      - name: Verify OpenAPI schema synchronization
        run: bash scripts/check_schema.sh

      - name: Run backend tests against PostgreSQL
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: shopcrm_test
          DB_USER: shopcrm
          DB_PASSWORD: shopcrm_password
          REDIS_URL: redis://localhost:6379/1
        run: pytest backend/

  frontend:
    name: Frontend CI (Node 22, Lint, Karma Tests, Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check schema TypeScript synchronization
        working-directory: frontend
        run: npm run check:api

      - name: Lint TypeScript & Templates
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests (Chrome Headless)
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
